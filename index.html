/* Layout: app bar (logo · language · client/salon); client = one phone-width column; salon cabinet = wider column with tabs */
:root{
  --paper:#F3F6F7; --card:#FFFFFF; --ink:#14202B; --muted:#5A6772; --line:#DCE3E7;
  --accent:#0A7F96; --accent-ink:#FFFFFF; --accent-soft:#DCEFF3;
  --gold:#C98A00; --gold-soft:#FBF0D4; --danger:#BF3A2B; --ok:#1C8752;
  --wa:#DCF5D0; --wa-ink:#173D22; --shade:rgba(20,32,43,.08);
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E151B; --card:#162029; --ink:#E5ECF0; --muted:#98A6B0; --line:#273541;
  --accent:#3DC1D9; --accent-ink:#03222A; --accent-soft:#11323C;
  --gold:#F2B935; --gold-soft:#3A2E10; --danger:#F07366; --ok:#4CC98A;
  --wa:#1E3A27; --wa-ink:#D7F2DC; --shade:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E151B; --card:#162029; --ink:#E5ECF0; --muted:#98A6B0; --line:#273541;
  --accent:#3DC1D9; --accent-ink:#03222A; --accent-soft:#11323C;
  --gold:#F2B935; --gold-soft:#3A2E10; --danger:#F07366; --ok:#4CC98A;
  --wa:#1E3A27; --wa-ink:#D7F2DC; --shade:rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.narrow{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:8px -6px 0 -3px var(--gold)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;margin-left:5px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:500}
.tabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--display);font-weight:500;font-size:20px;line-height:1.25;margin:0;text-wrap:balance}
h3{margin:0;font-size:18px}
.muted{color:var(--muted)}
.small{font-size:14px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

.loc{display:flex;flex-direction:column;gap:10px}
.loc .where{display:flex;gap:10px;align-items:center}
.pin{flex:none;width:36px;height:36px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center}
.pin svg{width:18px;height:18px;fill:var(--accent)}
select,input[type=text],input[type=tel],input[type=number],textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
.search{position:relative}
.search input{padding-left:40px;font-size:16px;height:48px}
.search svg{position:absolute;left:13px;top:14px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.list{display:flex;flex-direction:column;gap:10px}
.salon{display:grid;grid-template-columns:56px 1fr;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px}
.salon:hover{border-color:var(--accent)}
.ava{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink)}
.salon .nm{font-weight:600;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--muted)}
.star{color:var(--gold);font-weight:600}
.dist{color:var(--ink);font-weight:600}
.open{color:var(--ok)} .closed{color:var(--danger)}

.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:14px;padding:13px 16px;width:100%;font-size:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn2{border:1px solid var(--line);background:var(--card);font-weight:600;border-radius:14px;padding:12px 16px;width:100%}
.mini{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:500}
.mini.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mini.danger{color:var(--danger);border-color:var(--danger)}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:0;align-self:flex-start}

.svc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.svc:first-of-type{border-top:0}
.svc .p{font-weight:600;white-space:nowrap}
.pick{display:flex;flex-direction:column;gap:8px}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px}
.pick button:hover{border-color:var(--accent)}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mav{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:600}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.days button{flex:none;width:54px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.days small{font-size:11px;color:var(--muted)}
.days b{font-size:17px}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days button[aria-pressed="true"] small{color:var(--accent-ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.slots button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 0;font-variant-numeric:tabular-nums;font-weight:500}
.slots button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;background:var(--paper);border-radius:14px;padding:12px 14px;margin:0}
.sum dt{color:var(--muted)} .sum dd{margin:0;text-align:right;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.err{color:var(--danger);font-size:14px;margin:0}
.ok{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:28px;font-weight:700}
.wa{background:var(--wa);color:var(--wa-ink);border-radius:4px 16px 16px 16px;padding:12px 14px;font-size:15px}
.wa small{display:block;opacity:.75;font-size:12px;margin-bottom:4px}

.rev{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.rev:first-of-type{border-top:0}
.stars{color:var(--gold);letter-spacing:1px}
.ver{font-size:12px;color:var(--ok);font-weight:500}
.reply{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:14px}
.reply b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.rate{display:flex;gap:6px}
.rate button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:44px;height:44px;font-size:20px;color:var(--muted)}
.rate button[aria-pressed="true"]{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--muted);font-weight:500}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.new{background:var(--accent);color:var(--accent-ink)}
.bk{display:grid;grid-template-columns:62px 1fr;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.bk.new{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.bk .t{font-weight:600;font-variant-numeric:tabular-nums}
.bk .t small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.bk .info{display:flex;flex-direction:column;gap:3px;min-width:0}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{font-family:var(--display);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:180px;padding-top:18px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.col .v{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.col .b{width:100%;max-width:40px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.col.today .b{background:var(--gold)}
.col .d{font-size:12px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:14px}
.hbar .track{grid-column:1/-1;height:8px;background:var(--paper);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.formrow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td{padding:10px 6px;border-top:1px solid var(--line)}
.tbl td.r{text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto}
.note{font-size:13px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px var(--shade);z-index:20}

@media (max-width:720px){
  .stats{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .formrow{grid-template-columns:1fr 1fr}
  .formrow .wide{grid-column:1/-1}
}
</style>

<div class="wrap">
  <header class="bar">
    <div class="logo"><i></i>tap</div>
    <div class="controls">

        <button id="mode-client" data-a="mode" data-v="client"></button>
        <button id="mode-salon" data-a="mode" data-v="salon"></button>
      </div>
    </div>
  </header>
  <main id="app"></main>
</div>
<div id="toast" class="toast" hidden></div>

  for (let tm = s.open; tm + sv.dur <= s.close; tm += 30){
    if (isToday && tm <= n + 30) continue;
    const m = ms.find(m => !bookings.some(b => b.id !== exclude && b.status==='active' && b.salon===s.id && b.master===m.id && b.date===k && tm < b.start+b.dur && b.start < tm+sv.dur));
    if (m) out.push({t:tm, m:m.id});
  }
  return out;
}

    const bySvc = s.services.map(x => ({x, n:act.filter(b => b.svc===x.id).length})).sort((a,b) => b.n-a.n);
    const maxS = Math.max(...bySvc.map(z => z.n), 1);
    const byM = s.masters.map(m => { const mine = act.filter(b => b.master===m.id); return {m, n:mine.length, r:mine.reduce((a,b)=>a+svcOf(s,b.svc).price,0)}; }).sort((a,b) => b.r-a.r);
    const maxM = Math.max(...byM.map(z => z.r), 1);
    body = `<div class="lbl">${t('week')}</div>
      <div class="stats">
        <div class="stat"><small>${t('sB')}</small><b>${act.length}</b></div>
        <div class="stat"><small>${t('sR')}</small><b>${money(rev)}</b></div>
        <div class="stat"><small>${t('sA')}</small><b>${money(act.length ? rev/act.length : 0)}</b></div>
        <div class="stat"><small>${t('sC')}</small><b>${inWeek.length - act.length}</b></div>
      </div>
      <div class="card"><h3>${t('byDay')}</h3>
        <div class="chart">${keys.map((k,i) => { const d = parseKey(k);
          return `<div class="col ${k===TODAY?'today':''}"><span class="v">${short(perDay[i])}</span><div class="b" style="height:${(perDay[i]/max*120).toFixed(0)}px"></div><span class="d">${k===TODAY ? t('today') : WD[st.lang][d.getDay()]+' '+d.getDate()}</span></div>`; }).join('')}</div>
      </div>
      <div class="grid2">
        <div class="card"><h3>${t('top')}</h3>${bySvc.map(z => `<div class="hbar"><span>${esc(tr(z.x))}</span><span class="muted">${z.n} ${t('times')}</span><div class="track"><div class="fill" style="width:${(z.n/maxS*100).toFixed(0)}%"></div></div></div>`).join('')}</div>
        <div class="card"><h3>${t('byM')}</h3>${byM.map(z => `<div class="hbar"><span>${esc(z.m.name)} · <span class="muted">${z.n}</span></span><b>${money(z.r)}</b><div class="track"><div class="fill" style="width:${(z.r/maxM*100).toFixed(0)}%"></div></div></div>`).join('')}</div>
      </div>`;
  }
  return `<div class="row between"><h2>${t('cab')}: ${esc(s.name)}</h2></div>${tabs}${body}`;
}

/* ===================== render & events ===================== */
const app = document.getElementById('app');
function render(){
  document.documentElement.lang = st.lang === 'kz' ? 'kk' : 'ru';
  ['kz','ru'].forEach(l => document.getElementById('lang-'+l).setAttribute('aria-pressed', st.lang===l));
  const mc = document.getElementById('mode-client'), ms = document.getElementById('mode-salon');
  mc.textContent = t('client'); ms.textContent = t('salon');
  if (st.unseen) ms.insertAdjacentHTML('beforeend', `<span class="badge">${st.unseen}</span>`);
  mc.setAttribute('aria-pressed', st.mode==='client'); ms.setAttribute('aria-pressed', st.mode==='salon');
  let html;
  if (st.mode==='salon') html = viewOwner();
  else if (st.view==='salon') html = viewSalon();
  else if (st.view==='book') html = viewBook();
  else if (st.view==='my') html = viewMy();
  else html = `<div class="narrow">${viewHome()}</div>`;
  app.innerHTML = st.view==='my' && st.mode==='client' ? `<div class="narrow">${html}</div>` : html;
  const form = document.getElementById('bookForm');
  if (form) form.addEventListener('submit', e => { e.preventDefault(); confirmBook(); });
}
let tt;
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2600); }
const top0 = () => window.scrollTo({top:0});

function confirmBook(){
  const f = st.flow, s = sal(f.salon), sv = svcOf(s, f.svc);
  const name = st.form.name.trim(), digits = st.form.phone.replace(/\D/g,'');
  if (!name){ st.err = t('errName'); return render(); }
  if (digits.length < 10){ st.err = t('errPhone'); return render(); }
  const still = slotsFor(s, f.svc, f.assigned, f.date).some(x => x.t === f.t);
  if (!still){ st.err = t('errTaken'); f.step = 3; f.t = null; return render(); }
  const b = addB({salon:s.id, master:f.assigned, svc:f.svc, date:f.date, start:f.t, dur:sv.dur, name, phone:st.form.phone.trim(), wa:st.form.wa, mine:true, isNew:true});
  st.last = b; st.err = ''; f.step = 5;
  if (s.id === OWNER){ st.unseen++; st.o.day = f.date; }
  render(); top0();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  const f = st.flow;
  switch(a){
    case 'lang': st.lang = v; try { localStorage.setItem('zh-lang', v); } catch(_) {} break;
    case 'mode':
      st.mode = v;
      if (v==='salon'){ if (st.unseen) toast(st.lang==='kz' ? 'Жаңа жазылу келді' : 'У вас новая запись'); st.unseen = 0; }
      else bookings.forEach(b => b.isNew = false);
      top0(); break;
    case 'go': st.view = v; st.err = ''; st.confirmId = null; st.revFor = null; top0(); break;
    case 'cat': st.cat = v; break;
    case 'open': st.salon = v; st.stab = 'services'; st.view = 'salon'; top0(); break;
    case 'stab': st.stab = v; break;
    case 'gps': return detect();
    case 'startBook':
      st.flow = {salon:st.salon, svc:v || null, master:null, assigned:null, date:TODAY, t:null, step: v ? 2 : 1, fromSvc: !!v};
      st.err = ''; st.view = 'book'; top0(); break;
    case 'fback':
      st.err = '';
      if (f.move || f.step===5){ st.view = 'my'; st.flow = null; }
      else if (f.step===1 || (f.step===2 && f.fromSvc)) { st.view = 'salon'; }
      else f.step--;
      break;
    case 'fsvc': f.svc = v; f.step = 2; break;
    case 'fmaster': f.master = v; f.t = null; f.step = 3; firstDayWithSlots(); break;
    case 'fday': f.date = v; f.t = null; st.err = ''; break;
    case 'fslot': f.t = +v; f.assigned = el.dataset.m; st.err = ''; break;
    case 'fnext': if (f.t != null){ f.step = 4; st.err = ''; } break;
    case 'fmove': {
      const b = bookings.find(x => x.id === f.move);
      b.date = f.date; b.start = f.t; b.master = f.assigned;
      st.flow = null; st.view = 'my'; toast(t('moved')); break; }
    case 'move': {
      const b = bookings.find(x => x.id === +v);
      st.flow = {salon:b.salon, svc:b.svc, master:b.master, assigned:b.master, date:b.date, t:null, step:3, move:b.id};
      st.view = 'book'; st.err = ''; top0(); break; }
    case 'cancel': st.confirmId = +v; break;
    case 'cancelNo': st.confirmId = null; break;
    case 'cancelYes': { const b = bookings.find(x => x.id === +v); b.status = 'cancelled'; st.confirmId = null; toast(t('cancelled')); break; }
    case 'revOpen': st.revFor = +v; st.revStars = 0; st.revText = ''; st.err = ''; break;
    case 'revClose': st.revFor = null; st.err = ''; break;
    case 'star': st.revStars = +v; st.err = ''; break;
    case 'sendRev': {
      if (!st.revStars){ st.err = t('errStars'); break; }
      const b = bookings.find(x => x.id === +v), s = sal(b.salon);
      s.reviews.unshift({a:b.name, s:st.revStars, d:0, txt:st.revText.trim() || '—', key:s.id+':n'+(uid++)});
      s.rating = Math.round(((s.rating*s.count + st.revStars)/(s.count+1))*10)/10; s.count++;
      b.reviewed = true; st.revFor = null; st.err = ''; toast(t('thanks')); break; }
    case 'otab': st.o.tab = v; break;
    case 'oday': st.o.day = v; break;
    case 'om': st.o.m = v; break;
    case 'reply': {
      const r = sal(v.split(':')[0]).reviews.find(x => x.key === v); if (!r) return;
      const txt = (st.o.drafts[v] || '').trim(); if (!txt) return;
      r.reply = txt; delete st.o.drafts[v]; toast(t('replied')); break; }
    case 'delSvc': { const s = sal(OWNER); s.services = s.services.filter(x => x.id !== v); break; }
    case 'addSvc': {
      const o = st.o, price = parseInt(o.nsPrice, 10);
      if (!o.nsName.trim() || !(price > 0)) { toast(t('svcErr')); return; }
      const s = sal(OWNER), id = 'x'+uid++;
      s.services.push({id, ru:o.nsName.trim(), kz:o.nsName.trim(), dur:+o.nsDur, price});
      s.masters.forEach(m => m.skills.push(id));
      o.nsName = ''; o.nsPrice = ''; toast(t('added')); break; }
    case 'addM': {
      const o = st.o; if (!o.nmName.trim()) { toast(t('mErr')); return; }
      const s = sal(OWNER);
      s.masters.push({id:'m'+uid++, name:o.nmName.trim(), ru:o.nmSpec.trim()||'—', kz:o.nmSpec.trim()||'—', skills:s.services.map(x => x.id)});
      o.nmName = ''; o.nmSpec = ''; toast(t('added')); break; }
    case 'saveHours': {
      const s = sal(OWNER), op = +document.getElementById('f-open').value, cl = +document.getElementById('f-close').value;
      if (cl > op){ s.open = H(op); s.close = H(cl); toast(t('saved')); }
      break; }
    default: return;
  }
  render();
});
function firstDayWithSlots(){
  const f = st.flow, s = sal(f.salon);
  for (const d of DAYS){ const k = keyOf(d); if (slotsFor(s, f.svc, f.master, k).length){ f.date = k; return; } }
}

document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.f; if (!k) return;
  if (k==='q'){ st.q = el.value; document.getElementById('list').innerHTML = listHTML(); }
  else if (k==='name' || k==='phone') st.form[k] = el.value;
  else if (k==='revText') st.revText = el.value;
  else if (k==='draft') st.o.drafts[el.dataset.k] = el.value;
  else if (k in st.o) st.o[k] = el.value;
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.f; if (!k) return;
  if (k==='wa') st.form.wa = el.checked;
  else if (k==='district'){ const d = DISTRICTS.find(x => x.id===el.value); st.loc = {lat:d.lat, lng:d.lng, d:d.id, gps:false}; st.locMsg = ''; render(); }
  else if (k==='nsDur') st.o.nsDur = el.value;
});

function detect(){
  const fail = () => { st.locBusy = false; st.locMsg = t('locFail'); render(); };
  if (!('geolocation' in navigator)) return fail();
  st.locBusy = true; st.locMsg = ''; render();
  let done = false;
  const timer = setTimeout(() => { if (!done){ done = true; fail(); } }, 6000);
  try {
    navigator.geolocation.getCurrentPosition(p => {
      if (done) return; done = true; clearTimeout(timer);
      const here = {lat:p.coords.latitude, lng:p.coords.longitude};
      st.locBusy = false;
      if (distKm(here, DISTRICTS[0]) > 30){ st.loc = {lat:DISTRICTS[0].lat, lng:DISTRICTS[0].lng, d:'alf', gps:false}; st.locMsg = t('far'); }
      else st.loc = {lat:here.lat, lng:here.lng, d:null, gps:true};
      render();
    }, () => { if (!done){ done = true; clearTimeout(timer); fail(); } }, {timeout:5000, maximumAge:60000});
  } catch(_) { if (!done){ done = true; clearTimeout(timer); fail(); } }
}

/* give every review a stable key for owner replies */
SALONS.forEach(s => s.reviews.forEach((r,i) => r.key = s.id+':'+i));
render();
</script>
